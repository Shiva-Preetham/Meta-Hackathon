name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit and integration tests (no network, no API key)
        run: python -m pytest -q
      - name: Offline demo runs end to end
        run: python -m signalhq --db /tmp/ci.db demo --no-serve --workers 2
      - name: Eval report on the synthetic set
        run: python -m signalhq --db /tmp/ci.db eval report --out /tmp/report.md && cat /tmp/report.md
